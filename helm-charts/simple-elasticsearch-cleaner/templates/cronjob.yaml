apiVersion: batch/v1
kind: CronJob
metadata:
  name: simple-elasticsearch-cleaner
  namespace: "{{ .Values.namespace }}"
  labels:
    app: simple-elasticsearch-cleaner
    chart: {{ template "simple-elasticsearch-cleaner.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
spec:
  schedule: "{{ .Values.schedule }}"
  jobTemplate:
    metadata:
      labels:
        app: simple-elasticsearch-cleaner
        release: {{ .Release.Name }}
    spec:
      template:
        metadata:
          labels:
            app: simple-elasticsearch-cleaner
            release: {{ .Release.Name }}
        spec:
          containers:
            - name: simple-elasticsearch-cleaner
              image: "abdullahkhawer/simple-elasticsearch-cleaner:{{ .Values.image.tag }}"
              imagePullPolicy: "{{ .Values.image.pullPolicy }}"
              env:
                - name: ELASTICSEARCH_USER
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.secrets.user.name }}
                      key: {{ .Values.secrets.user.key }}
                - name: ELASTICSEARCH_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.secrets.password.name }}
                      key: {{ .Values.secrets.password.key }}
                - name: ELASTICSEARCH_HOST
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.secrets.host.name }}
                      key: {{ .Values.secrets.host.key }}
                - name: ELASTICSEARCH_PORT
                  value: "{{ .Values.esPort }}"
                - name: NUMBER_OF_DAYS
                  value: "{{ .Values.numberOfDays }}"
              resources:
                limits:
                  cpu: "{{ .Values.resources.limits.cpu }}"
                  memory: "{{ .Values.resources.limits.memory }}"
                requests:
                  cpu: "{{ .Values.resources.requests.cpu }}"
                  memory: "{{ .Values.resources.requests.memory }}"
              securityContext:
                allowPrivilegeEscalation: false
          restartPolicy: Never
        {{- if .Values.nodeSelector }}
          nodeSelector:
{{ toYaml .Values.nodeSelector | indent 12 }}
        {{- end }}
          securityContext:
            seccompProfile:
              type: RuntimeDefault
